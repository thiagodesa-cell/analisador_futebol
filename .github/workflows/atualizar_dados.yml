name: Atualizar Dados de Futebol

on:
  schedule:
    - cron: '0 */3 * * *' # Roda a cada 3 horas
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Executar o atualizador
        run: python atualizador.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "Robô de Atualização"
          git config --global user.email "robo@github.com"
          git add jogos.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática dos dados de jogos" && git push)